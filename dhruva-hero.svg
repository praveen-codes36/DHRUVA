<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#14122b"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".05"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".05"/></linearGradient>
<radialGradient id="star" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="260" rx="18" fill="url(#bg)"/>
<!-- twinkling stars -->
<g fill="url(#star)">
<circle cx="80" cy="40" r="5"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="28" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="45" r="5"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
<circle cx="820" cy="30" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<!-- Pole star: the fixed point -->
<g transform="translate(450,62)"><circle r="26" fill="url(#star)" opacity=".5"><animate attributeName="r" values="22;32;22" dur="3s" repeatCount="indefinite"/></circle>
<path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4Z" fill="#fde68a"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></path></g>
<text x="450" y="112" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">ONE FIXED POINT YOU CAN TRUST</text>
<!-- track -->
<line x1="60" y1="190" x2="840" y2="190" stroke="#334155" stroke-width="4"/>
<line x1="60" y1="190" x2="840" y2="190" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 12"><animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite"/></line>
<g fill="#0b1220" stroke="#22d3ee" stroke-width="3"><circle cx="60" cy="190" r="9"/><circle cx="450" cy="190" r="9"/><circle cx="840" cy="190" r="9"/></g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle"><text x="60" y="222">Origin</text><text x="450" y="222">Next station</text><text x="840" y="222">Destination</text></g>
<!-- confidence band around ETA -->
<rect x="450" y="150" width="120" height="80" fill="url(#band)" rx="40"><animate attributeName="x" values="640;372;640" dur="6s" repeatCount="indefinite"/><animate attributeName="width" values="60;150;60" dur="6s" repeatCount="indefinite"/></rect>
<!-- train -->
<g><rect x="-26" y="174" width="52" height="22" rx="6" fill="#22d3ee"/><rect x="-18" y="179" width="10" height="8" rx="2" fill="#0b1220"/><rect x="-3" y="179" width="10" height="8" rx="2" fill="#0b1220"/><rect x="12" y="179" width="10" height="8" rx="2" fill="#0b1220"/>
<animateMotion dur="6s" repeatCount="indefinite" path="M60,0 L450,0"/></g>
<text x="150" y="150" fill="#22d3ee" font-family="Fira Code,Consolas,monospace" font-size="13">ETA ± confidence</text>
</svg>
